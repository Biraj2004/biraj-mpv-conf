### General
osc=no
title-bar=yes
keep-open=yes
title=${?media-title:${!playlist-count==1:[${playlist-pos-1}/${playlist-count}] }${media-title}}${!media-title:${?filename:${!playlist-count==1:[${playlist-pos-1}/${playlist-count}] }${filename/no-ext}}${!filename:No file}} - mpv

autofit="85%x85%"
autofit-larger="85%x85%"
autofit-smaller=640x360
geometry=50%:50%

cursor-autohide=1000
cursor-autohide-fs-only=yes

# Fixes the double seekbar issue when seeking with arrow keys
osd-bar=no

### Watch history & resume
save-position-on-quit=yes
watch-later-directory="~~cache/watch_later"
save-watch-history=no
watch-later-options=start,vid,aid,sid
watch-later-options-remove=sub-pos
reset-on-next-file=pause,speed,vf,af,audio-delay,sub-delay

### OSD
osd-level=1
osd-duration=2500
osd-playing-msg-duration=2500
osd-font-size=26
osd-outline-size=0
osd-shadow-offset=4
osd-back-color=0/0.5
osd-border-style=background-box
osd-playlist-entry=filename

### Extension Support
image-exts=apng,avif,bmp,heic,heif,j2k,jp2,jpeg,jpg,jxl,png,qoi,svg,tga,tif,tiff,webp
audio-exts=aac,ac3,aiff,ape,au,dsf,dts,flac,m4a,mid,midi,mka,mp1,mp2,mp3,mpc,oga,ogg,ogm,opus,tak,thd,tta,wav,wma,wv
video-exts=3g2,3gp,asf,avi,f4v,flv,gif,h264,h265,hevc,ivf,m2ts,m4v,mj2,mkv,mov,mp4,mp4v,mpeg,mpg,mxf,ogv,rmvb,ts,webm,wmv,y4m,dav,m3u,m3u8

# Directory loading & playlist filtering
directory-mode=auto
directory-filter-types=video
autocreate-playlist=no

### Screenshots
screenshot-format=jpeg
screenshot-jpeg-quality=99
screenshot-directory=~/Pictures/MPV-Screenshots
screenshot-template="%F-(%P)-%n"

### Cache (system RAM)
cache=auto
cache-on-disk=no
demuxer-max-bytes=135MiB         
demuxer-max-back-bytes=45MiB    
demuxer-readahead-secs=13        
demuxer-seekable-cache=yes
demuxer-cache-dir="~~cache/demuxer"
cache-pause=yes
cache-pause-initial=no

### Video
vo=gpu-next
gpu-context=auto
# Caches compiled GPU shaders in segregated cache subfolder
gpu-shader-cache-dir="~~cache/shaders"
icc-cache-dir="~~cache/icc"
d3d11-flip=yes
# Prevents exclusive fullscreen mode to avoid triggering fullscreen G-Sync / FreeSync
d3d11-exclusive-fs=no
hwdec=auto-safe
hwdec-extra-frames=16
fullscreen=no
# video-sync=display-resample is primarily beneficial for users with 60 Hz screens who enable heavy motion interpolation (interpolation=yes).
# video-sync=display-resample
# video-sync=audio is used as default and works best for my device.
video-sync=audio

# Debanding & Dithering
# Kept off by default to preserve fine film grain, micro-textures, and starfields on high-quality video
deband=no
# Balanced, detail-preserving deband parameters (smooths banding without "plastic/wax" face smudging)
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5
dither-depth=auto
temporal-dither=yes
sigmoid-upscaling=yes
correct-downscaling=yes

### HDR & Dolby Vision (Tone-Mapping & Passthrough)
# Seamlessly tone-maps HDR10 & Dolby Vision to SDR on standard displays without washed-out colors
# Automatically passes HDR metadata on Windows HDR displays while avoiding swapchain reset stalls on SDR
target-colorspace-hint=auto
target-contrast=auto
tone-mapping=auto
hdr-compute-peak=auto
gamut-mapping-mode=auto
hwdec-codecs=all

### Audio
# Audio Output Driver: Priority to WASAPI (Windows), with native fallbacks for macOS (CoreAudio) and Linux (PipeWire/Pulse)
ao=wasapi,coreaudio,pipewire,pulse,
audio-exclusive=no
volume=100
volume-max=200
audio-file-auto=fuzzy
audio-pitch-correction=yes
audio-stream-silence=yes
audio-wait-open=0
audio-buffer=0.09

### Subtitles
sub-auto=fuzzy
blend-subtitles=no
sub-hdr-peak=120
image-subs-hdr-peak=120
sid=no
# Prevents video pause/stutter during subtitle track switching
demuxer-mkv-subtitle-preroll=no
embeddedfonts=yes
sub-ass-use-video-data=all
sub-fix-timing=no
sub-use-margins=no
sub-ass-force-margins=no
sub-ass-override=no

sub-font-size=51
sub-color="#FFFFFF"
sub-border-size=1.8
sub-border-color="#000000"
sub-shadow-offset=1.5
sub-shadow-color=0/0/0/0.5
sub-border-style=outline-and-shadow
sub-margin-y=36
sub-file-paths=sub;subs;subtitles;srt;ass;vtt

### Languages
slang=en,enm
alang=hi,en,ja

### yt-dlp / Online Streaming
ytdl=yes
# Prioritizes 2K (1440p) -> Full HD (1080p) -> HD (720p) -> best available fallback
ytdl-format=bestvideo[height<=?1440]+bestaudio/best[height<=?1440]/best
script-opts-append=ytdl_hook-ytdl_path=yt-dlp
script-opts-append=ytdl_hook-all_formats=no

# Automatically extract full playlists when opening/pasting playlist URLs
ytdl-raw-options-append=yes-playlist=
# Advanced yt-dlp options (client spoofing, retries, cookies) are configured in yt-dlp.conf

### Profiles

[Window-PiP]
profile-desc=Custom options for PiP mode
profile-cond=ontop == true and not fullscreen
profile-restore=copy-equal
script-opts-append=modernz-scalewindowed=1.8
script-opts-append=modernz-persistent_progress=yes
border=no

[Minimized]
profile-desc=Pause when minimized
profile-cond=window_minimized and vid and not p["current-tracks/video/albumart"]
profile-restore=copy-equal
pause

[Video]
profile-desc=Apply options for videos
profile-cond=duration and duration > 0 and p["current-tracks/video"] and not p["current-tracks/video"].image
profile-restore=copy-equal
taskbar-progress=yes

[Image]
profile-desc=Apply options for images
profile-cond=p["current-tracks/video"] and p["current-tracks/video"].image and not p["current-tracks/video"].albumart
profile-restore=copy-equal
video-recenter=yes
taskbar-progress=no
image-display-duration=inf
video-aspect-method=ignore
script-opts-append=modernz-show_window_title=yes

[night-audio]
profile-desc=Dialogue Clarity & Dynamic Normalizer (Voice focus with tamed explosions)
af=lavfi=[highpass=f=75,equalizer=f=2500:t=q:w=1.2:g=3.5,dynaudnorm=f=75:g=25:p=0.55]

[dolby-vision-perf]
profile-desc=Lighter shader load for Dolby Vision content
profile-cond=p["video-params/colormatrix"] == "dolbyvision"
profile-restore=copy-equal
deband=no
sigmoid-upscaling=no
correct-downscaling=no
hdr-compute-peak=no


### Dynamic Protocol Caching (Online Streaming & Stremio)
[protocol.https]
profile-desc=Deep network buffer for online streams
demuxer-max-bytes=425MiB         ## For my Device - Use 600MiB if your device has 24GB+ RAM
demuxer-max-back-bytes=145MiB    ## For my Device - Use 250MiB if your device has 24GB+ RAM
demuxer-readahead-secs=20        ## For my Device - Use 25 if your device has 24GB+ RAM
demuxer-hysteresis-secs=4        ## For my Device - Use 5 if your device has 24GB+ RAM

[protocol.http]
profile=protocol.https

[protocol.ytdl]
profile=protocol.https


### YT-Streaming Quality Profiles (4K to 720p)
[q-720p]
profile-desc=Cap stream quality to 720p (HD)
ytdl-format=bestvideo[height<=?720]+bestaudio/best[height<=?720]/best

[q-1080p]
profile-desc=Cap stream quality to 1080p (Full HD)
ytdl-format=bestvideo[height<=?1080]+bestaudio/best[height<=?1080]/best

[q-1440p]
profile-desc=Cap stream quality to 1440p (2K)
ytdl-format=bestvideo[height<=?1440]+bestaudio/best[height<=?1440]/best

[q-best]
profile-desc=Best available stream quality (uncapped 4K/8K)
ytdl-format=bestvideo+bestaudio/best