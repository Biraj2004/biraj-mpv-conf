# hdr_badge.conf - Dynamic HDR / Dolby Vision / SDR Badge Configuration

# Enable or disable the format badge overlay
enable=yes

# Display duration in seconds on file launch before auto-hiding
duration=5

# Badge text format: "compact" (DV, HDR10+, HDR, HLG, SDR) or "full" (DOLBY VISION, HDR10+, HDR10, HLG, SDR)
badge_format=compact

# Show badge for standard dynamic range (SDR) videos
show_sdr=yes

# Trigger behaviors
show_on_start=yes
show_on_unpause=no
show_on_seek=no

# Position on screen: top_right, top_left, bottom_right, bottom_left, top_center
position=top_right

# Typography & Styling (Theme-matched with pause_indicator_lite & ModernZ)
font=Segoe UI
font_size=20
bold=yes

# Colors & Opacity (Exact match with pause_indicator_lite)
text_color=#FFFFFF
border_color=#111111
border_width=1.5
shadow_offset=0
opacity=80