# =======================================================================================================
# pause_notify.conf - On-Screen Pause Notification Configuration
# Part of biraj-mpv-conf (https://github.com/Biraj2004/biraj-mpv-conf)
# Developed by : Biraj Sarkar (@Biraj2004)
# =======================================================================================================

# Enable or disable the on-screen pause notification
enable=yes

# Custom prefix text before timestamp
prefix=Paused at 

# Hour format behavior:
# - auto: shows hours (HH:MM:SS) if total video length is >= 1 hour; shows MM:SS if under 1 hour
# - always: always shows hours (00:MM:SS)
# - never: always shows minutes and seconds (MM:SS)
hour_format=auto

# Include total media duration: "Paused at 08:27 / 43:40" (yes) vs "Paused at 08:27" (no)
show_duration=yes

# Refresh interval in seconds to keep OSD message active during long pauses and seek events
refresh_interval=1.0
