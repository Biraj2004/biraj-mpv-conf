# =======================================================================================================
# auto_exit_eof.conf - Graceful Auto-Exit Configuration
# Part of biraj-mpv-conf (https://github.com/Biraj2004/biraj-mpv-conf)
# Developed by : Biraj Sarkar (@Biraj2004)
# =======================================================================================================

# Enable or disable graceful auto-exit when reaching the end of media/playlist
enable=yes

# Total grace period in seconds to wait at EOF before mpv exits
delay=4.0

# Number of seconds before exit to display the on-screen warning
warning_time=2.0

# On-Screen display warning message (styled natively using mpv.conf OSD settings)
warning_text=Exiting...

# Display the warning message during the final seconds
show_warning=yes

# Only auto-exit when in fullscreen mode (yes) or in both windowed and fullscreen (no)
only_fullscreen=no

# Reset watch-later resume position when reaching the end of media (starts fresh from 0:00 on next open)
reset_watch_later=yes

# Number of seconds before the end of media to treat video as completed (default: 10.0 seconds)
eof_threshold=10.0