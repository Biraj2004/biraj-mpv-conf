# =======================================================================================================
# auto_exit_eof.conf - Graceful Auto-Exit Configuration
# Part of biraj-mpv-conf (https://github.com/Biraj2004/biraj-mpv-conf)
# Developed by : Biraj Sarkar (@Biraj2004)
# =======================================================================================================

# Enable or disable graceful auto-exit when reaching the end of media/playlist
enable=yes

# Total grace period in seconds to wait at EOF before mpv exits
delay=4.0

# Number of seconds before exit to display the on-screen warning
warning_time=2.0

# On-Screen display warning message (styled natively using mpv.conf OSD settings)
warning_text=Exiting...

# Display the warning message during the final seconds
show_warning=yes

# Only auto-exit when in fullscreen mode (yes) or in both windowed and fullscreen (no)
only_fullscreen=no

# Reset watch-later resume position when reaching the end of media (starts fresh from 0:00 on next open)
reset_watch_later=yes

# Percentage of total duration from the beginning to ignore watch-later (default: 2.0%)
# Quitting within the first 2% (e.g. accidental misclicks, opening logos) starts fresh from 0:00 on next playback
start_threshold_percent=2.0

# Percentage of total duration from the end to treat video as completed (default: 5.0% / 95% completion mark)
# Quitting within the final 5% (e.g. end credits roll >= 95%) clears watch-later and resets to 0:00 on next playback
eof_threshold_percent=5.0

# Minimum media duration in seconds required to enable watch-later saving (default: 100.0s)
# Videos shorter than or equal to this (e.g. memes, clips, GIFs, TikToks) never create watch-later resume files
min_duration=100.0