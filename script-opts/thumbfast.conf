# Thumbfast configuration
# Centralized thumbnail scratch buffer in common cache directory
thumbnail=~~cache/thumbnails/thumbfast.out
quit_after_inactivity=30

# Disable tone-mapping filter in the thumbnailer subprocess to prevent filtergraph crashes
# ("no path between colorspaces") on HDR10, Dolby Vision (Profile 5/8), and HLG videos (e.g. iPhone MOV & HEVC).
# Standard libswscale handles colorspace downconversion directly and reliably without zscale errors.
tone_mapping=no

# Enable hardware decoding for the thumbnailer subprocess to decode heavy HEVC / MOV
# (4K, 10-bit, 60fps) smoothly and instantly via GPU instead of stalling on CPU software decoding.
hwdec=yes

# Spawn thumbnailer process immediately on file load for zero-latency initial thumbnails
spawn_first=yes

# Windows only: use native Windows API to write to pipe (requires LuaJIT)
direct_io=yes

# Enable on network playback (set to yes if streaming remote MOV/HEVC videos)
network=no
