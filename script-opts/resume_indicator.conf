# =======================================================================================================
# resume_indicator.conf - On-Screen Resume Notification Configuration
# Part of biraj-mpv-conf (https://github.com/Biraj2004/biraj-mpv-conf)
# Developed by : Biraj Sarkar (@Biraj2004)
# =======================================================================================================

# Enable or disable the on-screen resume indicator
enable=yes

# OSD display duration in seconds (matches osd-duration)
duration=2.5

# Minimum playback percentage to trigger a resume notification (ignores fresh starts < 2%)
min_resume_percent=2.0

# Maximum playback percentage to trigger a resume notification (ignores near-completion >= 95%)
max_resume_percent=95.0

# Minimum media duration in seconds to trigger resume notification (default: 100.0s)
min_duration=100.0

# Include total media duration: "Resuming: (14:22 / 24:00)" (yes) vs "Resuming: (14:22)" (no)
show_duration=yes
