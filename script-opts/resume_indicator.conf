# =======================================================================================================
# resume_indicator.conf - On-Screen Resume Notification Configuration
# Part of biraj-mpv-conf (https://github.com/Biraj2004/biraj-mpv-conf)
# Developed by : Biraj Sarkar (@Biraj2004)
# =======================================================================================================

# Enable or disable the on-screen resume indicator
enable=yes

# OSD display duration in seconds (matches osd-duration)
duration=2.5

# Minimum playback timestamp in seconds to trigger a resume notification (ignores fresh starts < 3s)
min_resume_time=3.0

# Include total media duration: "Resuming: (14:22 / 24:00)" (yes) vs "Resuming: (14:22)" (no)
show_duration=yes
