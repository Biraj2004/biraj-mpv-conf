# screenshot_metadata.conf - Options for automated screenshot metadata injection
# Part of biraj-mpv-conf (https://github.com/Biraj2004/biraj-mpv-conf)

# Master toggle for automated metadata & HDR tag injection
enable=yes

# Inject standard TIFF/EXIF 'eXIf' chunk (Camera Make, Model, DateTime, Description, Software)
inject_exif=yes

# Inject PNG 'tEXt' chunks (Title, Timestamp, Frame, HDR Format, Primaries, TRC, Matrix, Mastering Luminance, Codec, GPS)
inject_text_chunks=yes

# Ensure cICP chunk (ITU-T H.273) is present for HDR / Wide Color Gamut screenshots
ensure_cicp=yes

# Show enhanced OSD confirmation badge with video format details
show_osd_badge=yes

# Duration (in seconds) to display the OSD confirmation badge
osd_duration=2.5

