# ==============================================================================
# yt-dlp Configuration - Standalone Streaming & mpv Integration
# ==============================================================================
# Official configuration file for yt-dlp.
# Place in:
#   1. %APPDATA%\yt-dlp\config          (System-wide user config)
#   2. In your mpv directory alongside yt-dlp.exe
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network Resilience & Anti-Throttling (99% Playback Reliability)
# ------------------------------------------------------------------------------
# Aggressive retry logic to survive temporary connection dips and Wi-Fi hiccups
--retries 10
--fragment-retries 10
--file-access-retries 3
--retry-sleep 1
--no-check-certificates

# Accelerate DASH/HLS segmented live and on-demand streaming chunks
--concurrent-fragments 4

# Prevent failure if a playlist has deleted/private videos
--compat-options no-youtube-unavailable-videos

# ------------------------------------------------------------------------------
# 2. Subtitles & Metadata Extraction
# ------------------------------------------------------------------------------
# Download all available official subtitles, excluding noisy live chats
--sub-langs all,-live_chat
--embed-subs

# Embed rich metadata (title, channel, upload date, description) & chapter markers
--embed-metadata
--embed-chapters

# Embed video thumbnail as cover art (Disabled by default: Icaros renders thumbnails directly
# from video frames for all containers, and disabling this preserves native .webm without yt-dlp forcing .mkv)
# --embed-thumbnail
# --convert-thumbnails jpg

# Selective lossless remuxing: only converts .ts (HLS/transport streams) to .mkv, preserving native .webm & .mp4
--remux-video ts>mkv

# ------------------------------------------------------------------------------
# 3. Playlist Handling
# ------------------------------------------------------------------------------
# Seamlessly extract full playlists when a playlist URL or mix is opened
--yes-playlist

# ------------------------------------------------------------------------------
# 4. Anti-Bot Client Spoofing (Fallback Options)
# ------------------------------------------------------------------------------
# Modern yt-dlp automatically negotiates optimal player endpoints. If YouTube
# ever applies aggressive bot checks or 403 Forbidden throttling on your IP,
# uncomment the line below:
# --extractor-args "youtube:player_client=android,web;player_skip=configs"

# ------------------------------------------------------------------------------
# 5. Authentication & Cookies (Live Browser Session or Custom Cookies File)
# ------------------------------------------------------------------------------
# If you watch age-restricted videos, YouTube Premium (1080p Enhanced Bitrate),
# or subscriber-only anime streams (Crunchyroll):
#
# Option A: Custom Exported Cookies File (Primary & Fallback)
# Chromium browsers (Brave, Chrome, Edge) lock their cookie database while running
# or enforce DPAPI encryption. Using an exported cookies.txt is 100% reliable:
--cookies "E:\YouTube Downloader (yt-dlp)\yt-cookies.txt"

# Option B: Live Browser Session (Zero manual export; works seamlessly with Firefox)
# NOTE: If enabling live browser session, comment out Option A above:
# --cookies-from-browser firefox
# --cookies-from-browser brave
# --cookies-from-browser chrome
# --cookies-from-browser edge


# ------------------------------------------------------------------------------
# 6. Standalone Quality & Format Preference
# ------------------------------------------------------------------------------
# Prioritizes 1440p (2K) -> 1080p -> 720p -> best available fallback
-f "bestvideo[height<=?1440]+bestaudio/best[height<=?1440]/best"